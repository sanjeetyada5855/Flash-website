<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flash — Social App</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b0d12;color:#f5f7fb}
button,input{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh;display:flex}
.side{width:230px;background:#12151d;border-right:1px solid #242936;padding:18px;position:fixed;inset:0 auto 0 0}
.logo{font-size:30px;font-weight:900;margin:5px 8px 28px}.logo span{color:#ffd21f}
.nav button{width:100%;padding:13px;margin:4px 0;border-radius:12px;text-align:left;background:transparent;color:#cbd0da}.nav button:hover,.nav .active{background:#202532;color:#fff}
.main{margin-left:230px;width:calc(100% - 230px);max-width:1100px;padding:25px;margin-right:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.top h1{margin:0}
.card{background:#12151d;border:1px solid #242936;border-radius:20px;padding:18px;margin-bottom:18px}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.muted{color:#8f98a8}.btn{padding:10px 14px;border-radius:12px;background:#ffd21f;color:#111;font-weight:800}.ghost{padding:10px 14px;border-radius:12px;background:#202532;color:#fff}.danger{background:#ff5d6c;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.story{height:190px;border-radius:18px;padding:14px;display:flex;align-items:flex-end;background:linear-gradient(160deg,#2a3345,#151820);border:1px solid #303646}
.avatar{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;background:#ffd21f;color:#111;font-weight:900;flex:none}
.avatar.sm{width:34px;height:34px;font-size:13px}
.search{width:100%;padding:13px;border-radius:12px;border:1px solid #303646;background:#0d1016;color:#fff}
.auth{position:fixed;inset:0;background:#080a0f;display:grid;place-items:center;padding:20px;z-index:50}.authbox{width:min(420px,100%);background:#12151d;border:1px solid #303646;border-radius:22px;padding:24px}.auth input{display:block;width:100%;margin:9px 0;padding:13px;border-radius:12px;border:1px solid #303646;background:#0d1016;color:#fff}
.auth .btn{width:100%;margin-top:8px}.hidden{display:none!important}
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:40}.modalbox{width:min(650px,100%);max-height:90vh;overflow:auto;background:#12151d;border:1px solid #303646;border-radius:22px;padding:20px}
#cameraVideo{width:100%;max-height:55vh;object-fit:cover;border-radius:16px;background:#000}.preview{max-width:100%;max-height:320px;border-radius:16px;margin-top:12px}
.chatbox{height:58vh;overflow:auto;background:#0d1016;border-radius:16px;padding:14px}.msg{padding:9px 12px;border-radius:14px;margin:7px 0;max-width:78%;background:#202532}.mine{margin-left:auto;background:#ffd21f;color:#111}
.bottom{display:none}.toast{position:fixed;bottom:20px;right:20px;background:#fff;color:#111;padding:12px 16px;border-radius:12px;z-index:100;box-shadow:0 8px 30px #0008}
@media(max-width:700px){.side{display:none}.main{margin:0;width:100%;padding:15px;padding-bottom:85px}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#12151d;border-top:1px solid #242936;z-index:30}.bottom button{flex:1;background:none;color:#aaa;padding:12px 4px}.bottom .active{color:#ffd21f}.top{margin-bottom:14px}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="auth" class="auth">
 <div class="authbox">
  <div class="logo">⚡ Flash</div>
  <p class="muted">Username se signup/login karo.</p>
  <input id="name" placeholder="Your name (signup)">
  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password (6+ characters)">
  <button id="signup" class="btn">Create account</button>
  <button id="login" class="ghost" style="width:100%;margin-top:8px">Login</button>
  <p id="authMsg" class="muted"></p>
 </div>
</div>

<aside class="side">
 <div class="logo">⚡ Flash</div>
 <div class="nav">
  <button class="active" data-page="home">🏠 Home</button>
  <button data-page="friends">👥 Friends</button>
  <button data-page="chat">💬 Chat</button>
  <button data-page="search">🔎 Search</button>
  <button data-page="profile">👤 Profile</button>
  <button id="cameraBtn">📷 Camera</button>
  <button id="themeBtn">🌙 Theme</button>
  <button id="logout" class="danger">↪ Logout</button>
 </div>
</aside>

<main class="main">
 <div class="top"><h1 id="title">Home</h1><div class="row"><span id="online" class="muted">● Offline</span></div></div>

 <section id="home" class="page">
  <div class="card"><h2>Stories</h2><div id="stories" class="grid"></div></div>
  <div class="card"><h2>Friends Snaps</h2><div id="snaps" class="grid"></div></div>
 </section>

 <section id="friends" class="page hidden">
  <div class="card"><h2>Find friends</h2><input id="friendSearch" class="search" placeholder="Search username"><div id="friendResults" style="margin-top:14px"></div></div>
  <div class="card"><h2>My friends</h2><div id="friendsList"></div></div>
 </section>

 <section id="chat" class="page hidden">
  <div class="card"><h2>Chats</h2><div id="chatList"></div></div>
 </section>

 <section id="search" class="page hidden">
  <div class="card"><h2>Search users</h2><input id="userSearch" class="search" placeholder="Username"><div id="userResults" style="margin-top:14px"></div></div>
 </section>

 <section id="profile" class="page hidden">
  <div class="card">
   <div class="row"><div id="profileAvatar" class="avatar">F</div><div><h2 id="profileName">Flash User</h2><p id="profileUsername" class="muted">@username</p></div></div>
   <hr style="border-color:#242936;margin:18px 0">
   <p class="muted">Your email is kept hidden from the profile UI.</p>
  </div>
 </section>
</main>

<nav class="bottom">
 <button class="active" data-page="home">🏠</button><button data-page="friends">👥</button><button data-page="chat">💬</button><button data-page="search">🔎</button><button data-page="profile">👤</button>
</nav>

<div id="cameraModal" class="modal hidden">
 <div class="modalbox">
  <div class="row"><h2 class="grow">Create Snap</h2><button id="closeCamera" class="ghost">✕</button></div>
  <video id="cameraVideo" autoplay playsinline></video>
  <canvas id="canvas" class="hidden"></canvas>
  <div class="row" style="margin-top:12px"><button id="flip" class="ghost">🔄 Flip</button><button id="capture" class="btn">📸 Capture</button><label class="ghost">🖼️ Gallery<input id="gallery" type="file" accept="image/*" hidden></label></div>
  <select id="filter" class="search" style="margin-top:12px"><option value="none">No filter</option><option value="grayscale(1)">Mono</option><option value="sepia(.7)">Warm</option><option value="contrast(1.35) saturate(1.3)">Bright</option></select>
  <div class="row" style="margin-top:12px"><input id="snapText" class="search" placeholder="Add text"><button id="postSnap" class="btn">Post</button></div>
  <img id="preview" class="preview hidden">
  <p id="cameraMsg" class="muted"></p>
 </div>
</div>

<div id="chatModal" class="modal hidden">
 <div class="modalbox">
  <div class="row"><h2 id="chatTitle" class="grow">Chat</h2><button id="closeChat" class="ghost">✕</button></div>
  <div id="messages" class="chatbox"></div>
  <div class="row" style="margin-top:10px"><input id="messageInput" class="search" placeholder="Message..."><button id="sendMessage" class="btn">Send</button></div>
 </div>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,collection,query,where,getDocs,addDoc,onSnapshot,serverTimestamp,orderBy} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyC_QE75QCiRJXGL9xewm1-yQXdZLtvDIY",
 authDomain:"fash-89525.firebaseapp.com",
 projectId:"fash-89525",
 storageBucket:"fash-89525.firebasestorage.app",
 messagingSenderId:"887751675734",
 appId:"1:887751675734:web:ec4adc251909fe006090f7"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
let currentUser=null,currentProfile=null,chatUser=null,unsubscribeChat=null,stream=null,facing="user",snapData=null;

function toast(t){$("toast").textContent=t;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),2200)}
function internalEmail(u){return u.toLowerCase().replace(/[^a-z0-9._-]/g,"")+"@flash-login.app"}
function cleanUser(){return $("username").value.trim().toLowerCase().replace(/^@/,"")}
async function signup(){
 const n=$("name").value.trim(),u=cleanUser(),p=$("password").value;
 if(!n||!u||p.length<6){$("authMsg").textContent="Name, username aur 6+ character password do.";return}
 try{
  const exists=await getDocs(query(collection(db,"users"),where("usernameLower","==",u)));
  if(!exists.empty){$("authMsg").textContent="Username already taken.";return}
  const c=await createUserWithEmailAndPassword(auth,internalEmail(u),p);
  await setDoc(doc(db,"users",c.user.uid),{uid:c.user.uid,name:n,username:u,usernameLower:u,createdAt:serverTimestamp()});
  await setDoc(doc(db,"usernames",u),{uid:c.user.uid});
 }catch(e){$("authMsg").textContent=e.message}
}
async function login(){
 const u=cleanUser(),p=$("password").value;
 if(!u||!p){$("authMsg").textContent="Username aur password do.";return}
 try{await signInWithEmailAndPassword(auth,internalEmail(u),p)}catch(e){$("authMsg").textContent="Login failed. Username/password check karo."}
}
$("signup").onclick=signup;$("login").onclick=login;$("logout").onclick=()=>signOut(auth);

function showPage(page){
 document.querySelectorAll(".page").forEach(x=>x.classList.add("hidden"));
 $(page).classList.remove("hidden");$("title").textContent=page[0].toUpperCase()+page.slice(1);
 document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
 if(page==="friends")loadFriends(); if(page==="chat")loadChatList(); if(page==="home")loadHome();
}
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>showPage(b.dataset.page));

onAuthStateChanged(auth,async user=>{
 currentUser=user;
 if(!user){$("auth").classList.remove("hidden");$("online").textContent="● Offline";return}
 $("auth").classList.add("hidden");$("online").textContent="● Online";
 const s=await getDoc(doc(db,"users",user.uid)); currentProfile=s.exists()?s.data():null;
 if(currentProfile){$("profileName").textContent=currentProfile.name+" ✨";$("profileUsername").textContent="@"+currentProfile.username;$("profileAvatar").textContent=currentProfile.name.charAt(0).toUpperCase()}
 loadHome();
});

function loadHome(){
 const now=Date.now();
 const stories=[
  {name:"Your Story",text:"Add a new snap",own:true},
  {name:"Flash Team",text:"Welcome to Flash"},
  {name:"Friends",text:"Share moments"}
 ];
 $("stories").innerHTML=stories.map(s=>`<div class="story" ${s.own?'id="yourStory"':''}><div><b>${s.name}</b><div class="muted">${s.text}</div></div></div>`).join("");
 document.querySelector("#yourStory")?.addEventListener("click",openCamera);
 $("snaps").innerHTML=`<div class="story"><div><b>📸 Create a Snap</b><div class="muted">Camera, filter, text & post</div></div></div>`;
 document.querySelector("#snaps .story").onclick=openCamera;
}

async function searchUsers(term,target){
 target.innerHTML="";
 term=term.trim().toLowerCase().replace(/^@/,""); if(!term)return;
 const q=query(collection(db,"users"),where("usernameLower","==",term)); const r=await getDocs(q);
 if(r.empty){target.innerHTML='<p class="muted">User not found.</p>';return}
 r.forEach(d=>renderUser(d.data(),target));
}
function renderUser(u,target){
 const div=document.createElement("div");div.className="row card";div.innerHTML=`<div class="avatar sm">${u.name[0].toUpperCase()}</div><div class="grow"><b>${u.name}</b><div class="muted">@${u.username}</div></div>`;
 if(u.uid!==currentUser.uid){const b=document.createElement("button");b.className="btn";b.textContent="Add";b.onclick=()=>addFriend(u);div.appendChild(b)}
 target.appendChild(div);
}
async function addFriend(u){
 await setDoc(doc(db,"users",currentUser.uid,"friends",u.uid),{uid:u.uid,name:u.name,username:u.username,addedAt:serverTimestamp()});
 toast("Friend added");loadFriends();
}
$("friendSearch").oninput=e=>searchUsers(e.target.value,$("friendResults"));
$("userSearch").oninput=e=>searchUsers(e.target.value,$("userResults"));

async function loadFriends(){
 const r=await getDocs(collection(db,"users",currentUser.uid,"friends"));$("friendsList").innerHTML="";
 if(r.empty){$("friendsList").innerHTML='<p class="muted">No friends yet.</p>';return}
 r.forEach(d=>{const u=d.data(),x=document.createElement("div");x.className="row card";x.innerHTML=`<div class="avatar sm">${u.name[0].toUpperCase()}</div><div class="grow"><b>${u.name}</b><div class="muted">@${u.username}</div></div><button class="btn">Chat</button>`;x.querySelector("button").onclick=()=>openChat(u);$("friendsList").appendChild(x)})
}
async function loadChatList(){
 const r=await getDocs(collection(db,"users",currentUser.uid,"friends"));$("chatList").innerHTML="";
 if(r.empty){$("chatList").innerHTML='<p class="muted">Add a friend first.</p>';return}
 r.forEach(d=>{const u=d.data(),x=document.createElement("div");x.className="row card";x.innerHTML=`<div class="avatar sm">${u.name[0].toUpperCase()}</div><div class="grow"><b>${u.name}</b><div class="muted">@${u.username}</div></div><button class="btn">Open</button>`;x.querySelector("button").onclick=()=>openChat(u);$("chatList").appendChild(x)})
}

function chatId(a,b){return [a,b].sort().join("_")}
function openChat(u){
 chatUser=u;$("chatTitle").textContent="Chat with "+u.name;$("chatModal").classList.remove("hidden");
 const cid=chatId(currentUser.uid,u.uid);
 if(unsubscribeChat)unsubscribeChat();
 const q=query(collection(db,"chats",cid,"messages"),orderBy("createdAt","asc"));
 unsubscribeChat=onSnapshot(q,s=>{
  $("messages").innerHTML="";s.forEach(d=>{const m=d.data(),x=document.createElement("div");x.className="msg "+(m.uid===currentUser.uid?"mine":"");x.textContent=m.text||"";$("messages").appendChild(x)});$("messages").scrollTop=$("messages").scrollHeight;
 });
}
$("closeChat").onclick=()=>{$("chatModal").classList.add("hidden");if(unsubscribeChat)unsubscribeChat()};
async function sendMessage(){
 if(!chatUser)return;const text=$("messageInput").value.trim();if(!text)return;
 const cid=chatId(currentUser.uid,chatUser.uid);
 await addDoc(collection(db,"chats",cid,"messages"),{uid:currentUser.uid,text,createdAt:serverTimestamp()});
 $("messageInput").value="";
}
$("sendMessage").onclick=sendMessage;$("messageInput").addEventListener("keydown",e=>{if(e.key==="Enter")sendMessage()});

async function openCamera(){
 $("cameraModal").classList.remove("hidden");$("cameraMsg").textContent="";
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});$("cameraVideo").srcObject=stream}
 catch(e){$("cameraMsg").textContent="Camera permission nahi mili. Gallery se image choose kar sakte ho."}
}
function closeCamera(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$("cameraVideo").srcObject=null;$("cameraModal").classList.add("hidden")}
$("cameraBtn").onclick=openCamera;$("closeCamera").onclick=closeCamera;
$("flip").onclick=async()=>{facing=facing==="user"?"environment":"user";if(stream){stream.getTracks().forEach(t=>t.stop());}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});$("cameraVideo").srcObject=stream}catch{}};
$("filter").onchange=e=>$("cameraVideo").style.filter=e.target.value;

$("capture").onclick=()=>{
 const v=$("cameraVideo"),c=$("canvas");if(!v.videoWidth){toast("Camera ready nahi hai");return}
 c.width=v.videoWidth;c.height=v.videoHeight;const x=c.getContext("2d");x.filter=$("filter").value;x.drawImage(v,0,0);snapData=c.toDataURL("image/jpeg",.88);$("preview").src=snapData;$("preview").classList.remove("hidden");
};
$("gallery").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{snapData=r.result;$("preview").src=snapData;$("preview").classList.remove("hidden")};r.readAsDataURL(f)};
$("postSnap").onclick=()=>{if(!snapData){toast("Pehle photo capture/select karo");return}toast("Snap preview ready — persistent cloud storage add karne ke liye Firebase Storage chahiye.");};

$("themeBtn").onclick=()=>{document.body.classList.toggle("light");document.body.style.background=document.body.classList.contains("light")?"#f4f6fa":"#0b0d12";document.body.style.color=document.body.classList.contains("light")?"#111":"#f5f7fb";toast("Theme changed")};
</script>
</body>
                                                                                                                              </html>
