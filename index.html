<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Flash — Social App</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b0b0f;color:#fff}
button,input{font:inherit}button{cursor:pointer;border:0}
.app{min-height:100vh;display:flex}.side{width:230px;background:#111116;border-right:1px solid #292930;padding:22px 14px;position:fixed;height:100vh}
.logo{font-size:28px;font-weight:800;text-align:center;margin-bottom:30px}.logo span{color:#ffe600}
.nav button{display:block;width:100%;text-align:left;background:transparent;color:#ddd;padding:14px;border-radius:12px;margin:5px 0}
.nav button:hover{background:#202027}.main{margin-left:230px;width:calc(100% - 230px);padding:25px;max-width:1200px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:0}
.avatar{width:46px;height:46px;border-radius:50%;background:#ffe600;color:#111;display:grid;place-items:center;font-weight:800}
.stories{display:flex;gap:14px;overflow:auto;padding:8px 0 22px}.story{min-width:78px;text-align:center}.story .avatar{margin:auto;border:3px solid #ffe600}.story small{display:block;margin-top:6px;color:#bbb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:#141419;border:1px solid #28282f;border-radius:18px;padding:18px;margin-bottom:18px}
.snap-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.snap{height:240px;border-radius:15px;background:linear-gradient(135deg,#25252d,#101014);display:flex;align-items:flex-end;padding:16px;position:relative;overflow:hidden}
.snap:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 30%,#ffe60033,transparent 35%)}
.snap div{position:relative;z-index:1}.snap b{display:block}.muted{color:#999}
.row{display:flex;gap:10px;align-items:center}.actions{display:flex;gap:8px;margin-top:12px}.btn{background:#ffe600;color:#111;padding:11px 16px;border-radius:11px;font-weight:700}.darkbtn{background:#25252d;color:#fff;padding:11px 16px;border-radius:11px}
.search{width:100%;padding:13px;background:#19191f;border:1px solid #303039;color:#fff;border-radius:12px;margin-bottom:15px}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:center;justify-content:center;padding:20px}.box{width:min(500px,100%);background:#15151b;border:1px solid #333;border-radius:20px;padding:24px;position:relative}.close{position:absolute;right:15px;top:12px;background:transparent;color:#fff;font-size:25px}
.box input{width:100%;padding:13px;margin:7px 0;background:#202027;border:1px solid #333;color:#fff;border-radius:10px}.box button.mainbtn{width:100%;padding:13px;margin-top:9px;border-radius:10px;background:#ffe600;font-weight:800}
.auth{z-index:50}.auth .box{text-align:center}.auth h1{font-size:34px}.auth h1 span{color:#ffe600}.error{color:#ff7777;min-height:22px;margin:8px}
.profile{text-align:center}.big{width:90px;height:90px;border-radius:50%;background:#ffe600;color:#111;display:grid;place-items:center;font-size:34px;font-weight:800;margin:5px auto 12px}.stats{display:flex;justify-content:space-around;margin:22px 0}.stat b,.stat small{display:block}.stat small{color:#aaa;margin-top:5px}
.chatlist .person{padding:13px;border-bottom:1px solid #292930;display:flex;justify-content:space-between;align-items:center}
.messages{height:300px;overflow:auto;background:#0e0e12;border-radius:12px;padding:12px}.msg{padding:9px 12px;border-radius:14px;background:#25252d;margin:7px 0;max-width:75%}.mine{margin-left:auto;background:#ffe600;color:#111}
.chatinput{display:flex;gap:8px;margin-top:10px}.chatinput input{margin:0}
.bottom{display:none}.hidden{display:none!important}
@media(max-width:700px){.side{display:none}.main{margin-left:0;width:100%;padding:16px;padding-bottom:85px}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#111116;border-top:1px solid #292930;z-index:10}.bottom button{flex:1;background:transparent;color:#ddd;padding:14px 5px}.top h1{font-size:24px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="logo">⚡ <span>Flash</span></div>
  <div class="nav">
    <button onclick="showPage('home')">🏠 Home</button>
    <button onclick="showPage('friends')">👥 Friends</button>
    <button onclick="showPage('chat')">💬 Chat</button>
    <button onclick="openSnap()">📸 Create Snap</button>
    <button onclick="openProfile()">👤 Profile</button>
    <button onclick="toggleTheme()">🌙 Theme</button>
    <button onclick="logout()">🚪 Logout</button>
  </div>
</aside>

<main class="main">
  <div class="top">
    <h1 id="pageTitle">Flash</h1>
    <button class="avatar" onclick="openProfile()" id="topAvatar">F</button>
  </div>

  <section id="homePage">
    <div class="card">
      <h2>Stories</h2>
      <div class="stories" id="stories"></div>
    </div>
    <input class="search" id="searchInput" placeholder="🔍 Search snaps..." oninput="filterSnaps()">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h2>Friends Snaps</h2><button class="btn" onclick="openSnap()">+ Snap</button>
      </div>
      <div class="snap-grid" id="snapGrid"></div>
    </div>
  </section>

  <section id="friendsPage" class="hidden">
    <div class="card">
      <h2>👥 Friends</h2>
      <input class="search" id="friendSearch" placeholder="Search by email/username">
      <button class="btn" onclick="findUser()">Find User</button>
      <div id="friendResult" style="margin-top:15px"></div>
      <div id="friendsList"></div>
    </div>
  </section>

  <section id="chatPage" class="hidden">
    <div class="card">
      <h2>💬 Chats</h2>
      <div id="chatList" class="chatlist"></div>
      <p class="muted" id="chatHint">Add a friend to start a chat.</p>
    </div>
  </section>
</main>
</div>

<nav class="bottom">
<button onclick="showPage('home')">🏠</button>
<button onclick="showPage('friends')">👥</button>
<button onclick="openSnap()">📸</button>
<button onclick="showPage('chat')">💬</button>
<button onclick="openProfile()">👤</button>
</nav>

<!-- AUTH -->
<div class="modal auth" id="authBox">
<div class="box">
<h1>⚡ <span>Flash</span></h1>
<p class="muted">Create your account or login</p>
<input id="authName" placeholder="Name (for new account)">
<input id="authUsername" placeholder="Username (for new account)">
<input id="authEmail" type="email" placeholder="Email">
<input id="authPassword" type="password" placeholder="Password">
<div class="error" id="authError"></div>
<button class="mainbtn" id="signupBtn">Create Account</button>
<button class="mainbtn" id="loginBtn">Login</button>
<button class="darkbtn" style="width:100%;margin-top:9px" onclick="guest()">Continue as Guest</button>
</div>
</div>

<!-- SNAP -->
<div class="modal" id="snapModal">
<div class="box">
<button class="close" onclick="closeModal('snapModal')">×</button>
<h2>📸 Create Snap</h2>
<input id="snapText" placeholder="Write a caption...">
<input id="snapFile" type="file" accept="image/*" onchange="previewImage(event)">
<img id="preview" style="display:none;width:100%;max-height:280px;object-fit:cover;border-radius:12px;margin-top:10px">
<button class="mainbtn" onclick="createSnap()">Post Snap</button>
<p class="muted">Image preview is local in this demo. Persistent image storage needs Firebase Storage.</p>
</div>
</div>

<!-- PROFILE -->
<div class="modal" id="profileModal">
<div class="box profile">
<button class="close" onclick="closeModal('profileModal')">×</button>
<div class="big" id="profileAvatar">F</div>
<h2 id="profileName">Flash User ✨</h2>
<p class="muted" id="profileUsername">@flashuser</p>
<p class="muted" id="profileEmail"></p>
<div class="stats">
<div class="stat"><b id="snapCount">0</b><small>Snaps</small></div>
<div class="stat"><b id="friendCount">0</b><small>Friends</small></div>
<div class="stat"><b>0</b><small>Followers</small></div>
</div>
<button class="darkbtn" onclick="logout()">🚪 Logout</button>
</div>
</div>

<!-- CHAT -->
<div class="modal" id="chatModal">
<div class="box">
<button class="close" onclick="closeModal('chatModal')">×</button>
<h2 id="chatTitle">Chat</h2>
<div class="messages" id="messages"></div>
<div class="chatinput">
<input id="messageInput" placeholder="Type a message...">
<button class="btn" onclick="sendMessage()">Send</button>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {
  getFirestore, doc, setDoc, getDoc, collection, addDoc, query,
  where, getDocs, orderBy, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_QE75QCiRJXGL9xew7m1-yQXdZLtvDIY",
  authDomain: "fash-89525.firebaseapp.com",
  projectId: "fash-89525",
  storageBucket: "fash-89525.firebasestorage.app",
  messagingSenderId: "887751675734",
  appId: "1:887751675734:web:ec4adc251909fe006090f7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let currentChatUid = null;
let guestMode = false;
let localSnaps = [
 {user:"Flash Team",caption:"Welcome to Flash ⚡"},
 {user:"Your Friend",caption:"Have a great day! ✨"},
 {user:"Flash",caption:"Create your first snap 📸"}
];

const authBox = document.getElementById("authBox");

function showAuthError(msg){document.getElementById("authError").textContent=msg||"";}

document.getElementById("signupBtn").onclick = async ()=>{
  const name=document.getElementById("authName").value.trim();
  const username=document.getElementById("authUsername").value.trim().replace(/\s+/g,"");
  const email=document.getElementById("authEmail").value.trim();
  const password=document.getElementById("authPassword").value;
  showAuthError("");
  if(!name||!username||!email||password.length<6){showAuthError("Name, username, email and password (6+ characters) are required.");return;}
  try{
    const cred=await createUserWithEmailAndPassword(auth,email,password);
    await setDoc(doc(db,"users",cred.user.uid),{
      uid:cred.user.uid,name,username:username.startsWith("@")?username.slice(1):username,
      email,createdAt:serverTimestamp()
    });
  }catch(e){showAuthError(e.message);}
};

document.getElementById("loginBtn").onclick = async ()=>{
  const email=document.getElementById("authEmail").value.trim();
  const password=document.getElementById("authPassword").value;
  showAuthError("");
  if(!email||!password){showAuthError("Enter email and password.");return;}
  try{await signInWithEmailAndPassword(auth,email,password);}
  catch(e){showAuthError(e.message);}
};

window.guest=()=>{guestMode=true;authBox.style.display="none";loadGuest();};

onAuthStateChanged(auth, async (user)=>{
  currentUser=user;
  if(user){
    guestMode=false;
    authBox.style.display="none";
    await loadProfile(user);
    loadFriends();
    loadSnapsFromFirebase();
  }
});

async function loadProfile(user){
  let data=null;
  try{const s=await getDoc(doc(db,"users",user.uid));if(s.exists())data=s.data();}catch(e){}
  const name=data?.name || user.email.split("@")[0];
  const username=data?.username || user.email.split("@")[0];
  setProfileUI(name,username,user.email);
}
function setProfileUI(name,username,email){
  document.getElementById("profileName").textContent=name+" ✨";
  document.getElementById("profileUsername").textContent="@"+username;
  document.getElementById("profileEmail").textContent=email||"Guest account";
  document.getElementById("profileAvatar").textContent=(name||"F").charAt(0).toUpperCase();
  document.getElementById("topAvatar").textContent=(name||"F").charAt(0).toUpperCase();
}

window.logout=async()=>{
  try{await signOut(auth);}catch(e){}
  guestMode=false;
  authBox.style.display="flex";
  closeModal("profileModal");
};

async function findUser(){
  const term=document.getElementById("friendSearch").value.trim().toLowerCase();
  const out=document.getElementById("friendResult");
  out.innerHTML="";
  if(!term){out.textContent="Enter a username or email.";return;}
  if(!currentUser){out.textContent="Login first.";return;}
  try{
    const q=query(collection(db,"users"),where("email","==",term));
    const snap=await getDocs(q);
    let found=[];
    snap.forEach(d=>found.push(d.data()));
    if(!found.length){
      const q2=query(collection(db,"users"),where("username","==",term.replace("@","")));
      const s2=await getDocs(q2);s2.forEach(d=>found.push(d.data()));
    }
    if(!found.length){out.textContent="User not found.";return;}
    const u=found[0];
    if(u.uid===currentUser.uid){out.textContent="That's your own account.";return;}
    out.innerHTML=`<div class="card"><div class="row"><div class="avatar">${(u.name||"F")[0].toUpperCase()}</div><div><b>${escapeHtml(u.name)}</b><div class="muted">@${escapeHtml(u.username||"user")}</div></div></div><div class="actions"><button class="btn" id="addFriendBtn">Add Friend</button><button class="darkbtn" id="openChatBtn">Chat</button></div></div>`;
    document.getElementById("addFriendBtn").onclick=()=>addFriend(u);
    document.getElementById("openChatBtn").onclick=()=>openChat(u);
  }catch(e){out.textContent="Search error. Check Firestore setup.";}
}

async function addFriend(u){
  try{
    await setDoc(doc(db,"users",currentUser.uid,"friends",u.uid),{uid:u.uid,name:u.name,username:u.username,email:u.email});
    await setDoc(doc(db,"users",u.uid,"friends",currentUser.uid),{uid:currentUser.uid,name:(await getDoc(doc(db,"users",currentUser.uid))).data()?.name||currentUser.email.split("@")[0],username:(await getDoc(doc(db,"users",currentUser.uid))).data()?.username||currentUser.email.split("@")[0],email:currentUser.email});
    loadFriends();alert("Friend added!");
  }catch(e){alert("Could not add friend. Check Firestore Security Rules.");}
}

function loadFriends(){
  if(!currentUser)return;
  onSnapshot(collection(db,"users",currentUser.uid,"friends"),snap=>{
    const list=document.getElementById("friendsList"),chat=document.getElementById("chatList");
    list.innerHTML="";chat.innerHTML="";
    let n=0;
    snap.forEach(d=>{
      const u=d.data();n++;
      list.innerHTML+=`<div class="person row"><div><b>${escapeHtml(u.name)}</b><div class="muted">@${escapeHtml(u.username||"user")}</div></div><button class="darkbtn" data-chat="${u.uid}">Chat</button></div>`;
      chat.innerHTML+=`<div class="person"><div><b>${escapeHtml(u.name)}</b><div class="muted">@${escapeHtml(u.username||"user")}</div></div><button class="darkbtn" data-chat="${u.uid}">Open</button></div>`;
    });
    document.getElementById("friendCount").textContent=n;
    [...document.querySelectorAll("[data-chat]")].forEach(b=>b.onclick=async()=>{const s=await getDoc(doc(db,"users",b.dataset.chat));if(s.exists())openChat(s.data());});
    document.getElementById("chatHint").style.display=n?"none":"block";
  });
}

function chatId(a,b){return [a,b].sort().join("_");}
async function openChat(u){
  if(!currentUser){alert("Login first.");return;}
  currentChatUid=u.uid;
  document.getElementById("chatTitle").textContent="Chat with "+(u.name||u.email||"Friend");
  document.getElementById("chatModal").style.display="flex";
  const ref=collection(db,"chats",chatId(currentUser.uid,u.uid),"messages");
  onSnapshot(query(ref,orderBy("createdAt","asc")),snap=>{
    const box=document.getElementById("messages");box.innerHTML="";
    snap.forEach(d=>{const m=d.data();box.innerHTML+=`<div class="msg ${m.uid===currentUser.uid?"mine":""}">${escapeHtml(m.text||"")}</div>`;});
    box.scrollTop=box.scrollHeight;
  });
}
window.sendMessage=async()=>{
  const input=document.getElementById("messageInput"),text=input.value.trim();
  if(!text||!currentUser||!currentChatUid)return;
  try{await addDoc(collection(db,"chats",chatId(currentUser.uid,currentChatUid),"messages"),{uid:currentUser.uid,text,createdAt:serverTimestamp()});input.value="";}
  catch(e){alert("Message could not be sent. Check Firestore Security Rules.");}
};

async function createSnap(){
  const caption=document.getElementById("snapText").value.trim()||"My new Flash snap ⚡";
  let name=currentUser?.email?.split("@")[0]||"Guest";
  if(currentUser){try{const s=await getDoc(doc(db,"users",currentUser.uid));if(s.exists())name=s.data().name||name;}catch(e){}}
  localSnaps.unshift({user:name,caption});
  renderSnaps();document.getElementById("snapText").value="";document.getElementById("snapFile").value="";document.getElementById("preview").style.display="none";closeModal("snapModal");
}
function renderSnaps(){
  const grid=document.getElementById("snapGrid");grid.innerHTML="";
  localSnaps.forEach((s,i)=>grid.innerHTML+=`<div class="snap" data-text="${escapeHtml((s.user+" "+s.caption).toLowerCase())}"><div><b>${escapeHtml(s.user)}</b><span>${escapeHtml(s.caption)}</span></div></div>`);
  document.getElementById("snapCount").textContent=localSnaps.length;
}
function renderStories(){
  const names=["Your Story","Flash","Friends","Today","Memories"];
  document.getElementById("stories").innerHTML=names.map((n,i)=>`<div class="story"><div class="avatar">${i===0?"+":n[0]}</div><small>${n}</small></div>`).join("");
}
window.filterSnaps=()=>{const t=document.getElementById("searchInput").value.toLowerCase();document.querySelectorAll(".snap").forEach(x=>x.style.display=x.dataset.text.includes(t)?"flex":"none");};
window.previewImage=(e)=>{const f=e.target.files[0],p=document.getElementById("preview");if(f){p.src=URL.createObjectURL(f);p.style.display="block";}};
window.openSnap=()=>document.getElementById("snapModal").style.display="flex";
window.openProfile=()=>document.getElementById("profileModal").style.display="flex";
window.closeModal=(id)=>document.getElementById(id).style.display="none";
window.showPage=(p)=>{
  document.getElementById("homePage").classList.toggle("hidden",p!=="home");
  document.getElementById("friendsPage").classList.toggle("hidden",p!=="friends");
  document.getElementById("chatPage").classList.toggle("hidden",p!=="chat");
  document.getElementById("pageTitle").textContent=p==="home"?"Flash":p==="friends"?"Friends":"Chats";
};
window.toggleTheme=()=>document.body.classList.toggle("light");
function loadGuest(){setProfileUI("Guest","guest","Guest mode");renderSnaps();renderStories();}
function loadSnapsFromFirebase(){renderSnaps();renderStories();}
function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
renderSnaps();renderStories();
</script>
</body>
  </html>
